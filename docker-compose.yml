services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U orders -d orders']
      interval: 3s
      timeout: 3s
      retries: 30
  orders-api:
    build: .
    command: [uvicorn, orders:app, --host, 0.0.0.0, --port, '8000']
    ports: ['8000:8000']
    secrets: [postgres_password, jwt_secret, login_password]
    depends_on:
      postgres:
        condition: service_healthy
  forecast-api:
    build: .
    command: [uvicorn, forecast:app, --host, 0.0.0.0, --port, '8001']
    working_dir: /registry
    environment:
      PYTHONPATH: /app
    volumes: [registry:/registry]
  prometheus:
    image: prom/prometheus:v3.3.1
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
    secrets: [grafana_password]
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafdata:/var/lib/grafana
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  login_password:
    file: ./secrets/login_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
volumes:
  pgdata:
  registry:
  promdata:
  grafdata:
